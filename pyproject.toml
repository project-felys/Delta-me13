[project]
name = "delta-me13"
version = "0.1.0"
description = "Dataset generation pipeline for Cyrene."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "FelysNeko" }]
dependencies = [
    "pandas>=3.0.5",
    "pydantic>=2.13.4",
    "tqdm>=4.69.1",
    "transformers>=5.14.1",
]

[dependency-groups]
dev = [
    "ruff>=0.16.0",
]

[project.scripts]
delta-me13 = "pipeline.cli:main"
delta-me13-pck = "pck.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline", "src/pck"]

[tool.hatch.build.targets.wheel.force-include]
"src/pipeline/implementation/tokenizer" = "pipeline/implementation/tokenizer"
"src/pipeline/patch/tts" = "pipeline/patch/tts"

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
